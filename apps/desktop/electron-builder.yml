appId: com.wslpilot.app
productName: WSLPilot
copyright: Copyright © 2026 WSLPilot Contributors
directories:
  buildResources: ../../build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: ../../build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WSLPilot
portable:
  artifactName: WSLPilot-${version}-portable.exe
