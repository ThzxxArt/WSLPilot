appId: com.wslpilot.app
productName: WSLPilot
copyright: Copyright © 2026 WSLPilot Contributors
directories:
  buildResources: ../../build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - '**/node-pty/**'
  - '**/node_modules/node-pty/**'
extraResources:
  # 图标由 files: resources/** 内置（asar），此处仅托盘运行时需要外部文件
  - from: resources/tray
    to: tray
    filter:
      - '**/*'

win:
  # 架构由调用方指定（--x64 / --arm64）：x64 与 arm64 分别在对应 runner 原生构建
  # （review C8：交叉编译会产出错误 ABI 的 node-pty）
  target:
    - target: nsis
    - target: portable
  icon: ../../build/icon.ico
  artifactName: WSLPilot-${version}-${arch}-setup.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  # 单步安装包（非 oneClick），允许用户自定义安装路径
  oneClick: false
  # 允许更改安装目录 —— 安装向导第二步可选路径
  allowToChangeInstallationDirectory: true
  # 允许选择「所有用户 / 当前用户」
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WSLPilot
  deleteAppDataOnUninstall: false
  installerIcon: ../../build/icon.ico
  uninstallerIcon: ../../build/icon.ico
  installerHeaderIcon: ../../build/icon.ico
  # 自定义 NSIS 脚本（安装前后钩子）
  include: installer.nsh
  # 安装包内显示的语言（2052 = 简体中文）
  language: '2052'
  guid: 7c8f3e2a-91b4-4c6d-8e5f-1a2b3c4d5e6f

portable:
  artifactName: WSLPilot-${version}-${arch}-portable.${ext}

# 产物示例：
#   WSLPilot-0.1.0-x64-setup.exe     （NSIS 安装包，可自定义路径）
#   WSLPilot-0.1.0-arm64-setup.exe
#   WSLPilot-0.1.0-x64-portable.exe  （免安装）
