name: Build ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts
        run: npm install-scripts approve electron esbuild vue-demi @parcel/watcher
        continue-on-error: true

      - name: Build
        run: npm run build --workspace @wslpilot/desktop

      - name: Package arm64
        run: npm run package --workspace @wslpilot/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: WSLPilot-arm64
          path: apps/desktop/release/*.exe
