name: Build ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Windows ARM64 (native)
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable npm 12 (corepack)
        run: corepack enable && corepack prepare npm@12 --activate

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build --workspace @wslpilot/desktop

      # arm runner 原生编译 arm64（node-pty 等原生模块 ABI 正确 — review C8）
      - name: Package arm64
        run: npm run package --workspace @wslpilot/desktop -- --arm64

      - uses: actions/upload-artifact@v4
        with:
          name: WSLPilot-installers-arm64
          path: apps/desktop/release/*.exe

      # tag 触发时等待 x64 release job 创建 Release 后再附加 arm64 安装包
      # （直接 gh-release 会自建无 notes 的 Release —— 核验修复竞态）
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" apps/desktop/release/*.exe --clobber
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Release ${{ github.ref_name }} 未在 5 分钟内出现，arm64 安装包未附加"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
