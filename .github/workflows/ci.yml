name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # 与 package.json packageManager（npm@12）对齐：allowScripts 白名单依赖 npm 12+
      - name: Enable npm 12 (corepack)
        run: corepack enable && corepack prepare npm@12 --activate && npm --version

      - name: Install dependencies (allowScripts 白名单生效)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # 设计令牌漂移门控（review 0.1.2）：tokens.ts 与生成的 tokens.generated.scss 必须同步
      - name: Tokens drift check
        run: npm run tokens:check

      - name: Unit & integration tests (coverage gate ≥85%)
        run: npm run test:coverage

      # 矩阵腿各自命名，避免 upload-artifact@v4 同名 409（review C6）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      - name: Component tests (coverage gate, hard gate)
        run: npm run test:component

      - name: Build (electron-vite)
        run: npm run build --workspace @wslpilot/desktop

      - name: Product smoke (main/preload module graph)
        run: npm run smoke:product

  e2e:
    name: E2E (Playwright)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable npm 12 (corepack)
        run: corepack enable && corepack prepare npm@12 --activate

      - name: Install dependencies
        run: npm ci

      - name: Build before E2E
        run: npm run build --workspace @wslpilot/desktop

      # Electron E2E 用 electron.launch，不需要 Playwright 浏览器（review m3）
      - name: Run E2E (hard gate)
        run: npm run test:e2e

      # 基线取证：缺基线/新增截图时把生成结果带出，供维护者入库（不放行假绿）
      - name: Upload visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/desktop/tests/e2e/__screenshots__
          if-no-files-found: ignore

      # 失败取证：actual / expected / diff 截图与 trace（视觉门禁红时定位根因用）
      - name: Upload E2E failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
