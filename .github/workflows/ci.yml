name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts (electron / esbuild)
        run: npm install-scripts approve electron esbuild vue-demi @parcel/watcher
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Component tests
        run: npm run test:component
        continue-on-error: true

      - name: Build (electron-vite)
        run: npm run build --workspace @wslpilot/desktop

  e2e:
    name: E2E (Playwright)
    runs-on: windows-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve install scripts
        run: npm install-scripts approve electron esbuild vue-demi @parcel/watcher
        continue-on-error: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run E2E
        run: npm run test:e2e
        continue-on-error: true
